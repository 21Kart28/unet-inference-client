name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e . pyinstaller
      - run: pyinstaller unet-client.spec
      - name: Smoke test the exe
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:XDG_CONFIG_HOME = "$env:RUNNER_TEMP\config"
          $proc = Start-Process -FilePath dist\unet-client\unet-client.exe -PassThru
          Start-Sleep -Seconds 15
          if ($proc.HasExited) { throw "unet-client.exe exited early with code $($proc.ExitCode)" }
          Stop-Process -Id $proc.Id
      - run: Compress-Archive -Path dist\unet-client\* -DestinationPath unet-client-windows-${{ github.ref_name }}.zip
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "unet-client-windows-${{ github.ref_name }}.zip"
          --title "${{ github.ref_name }}"
          --notes "Windows build of unet-client. Unzip and run unet-client.exe. See CHANGELOG.md for what changed."
          --verify-tag
