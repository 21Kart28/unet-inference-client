[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unet-inference-client"
version = "0.1.0"
description = "Desktop client for running MONAI Label segmentation inference and reviewing results in 3D Slicer"
readme = "README.md"
license = "MIT"
authors = [{ name = "Kartik" }]
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.5",
    "requests>=2.28",
    "numpy>=1.24",
    "SimpleITK>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.10", "types-requests"]

[project.scripts]
unet-client = "unet_inference_client.app:main"

[project.urls]
Repository = "https://github.com/21Kart28/unet-inference-client"

[tool.setuptools]
packages = ["unet_inference_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["unet_inference_client"]
omit = ["unet_inference_client/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75

[tool.mypy]
python_version = "3.10"
files = ["unet_inference_client"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
# The widget modules use PySide6's short enum names (QHeaderView.Stretch), which the stubs
# reject, and keep worker and thread attributes that start out as None. Checked loosely for now.
module = [
    "unet_inference_client.app",
    "unet_inference_client.class_table",
    "unet_inference_client.compare_tab",
    "unet_inference_client.model_compare_tab",
    "unet_inference_client.setup_tab",
]
ignore_errors = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# zip() over fixed-size geometry tuples; strict= would add noise without catching anything.
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# QT_QPA_PLATFORM must be set before PySide6 is imported, so the imports are split on purpose.
"tests/conftest.py" = ["E402", "I001"]
