[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unet-inference-client"
version = "0.1.0"
description = "Desktop client for running MONAI Label segmentation inference and reviewing results in 3D Slicer"
readme = "README.md"
license = "MIT"
authors = [{ name = "Kartik" }]
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.5",
    "requests>=2.28",
    "numpy>=1.24",
    "SimpleITK>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
unet-client = "unet_inference_client.app:main"

[project.urls]
Repository = "https://github.com/21Kart28/unet-inference-client"

[tool.setuptools]
packages = ["unet_inference_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# zip() over fixed-size geometry tuples; strict= would add noise without catching anything.
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# QT_QPA_PLATFORM must be set before PySide6 is imported, so the imports are split on purpose.
"tests/conftest.py" = ["E402", "I001"]
