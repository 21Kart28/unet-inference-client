[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unet-inference-client"
version = "0.1.0"
description = "Desktop client for running MONAI Label segmentation inference and reviewing results in 3D Slicer"
readme = "README.md"
license = "MIT"
authors = [{ name = "Kartik" }]
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.5",
    "requests>=2.28",
    "numpy>=1.24",
    "SimpleITK>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
unet-client = "unet_inference_client.app:main"

[project.urls]
Repository = "https://github.com/21Kart28/unet-inference-client"

[tool.setuptools]
packages = ["unet_inference_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
